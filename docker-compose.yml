services:
  svgapi:
    build: .
    image: svg-contour-normalizer:latest
    container_name: svg-contour-normalizer
    ports:
      - "8000:8000"
    environment:
      SVGAPI_DB_PATH: /data/svgapi.db
    volumes:
      - svgapi-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  svgapi-data:
